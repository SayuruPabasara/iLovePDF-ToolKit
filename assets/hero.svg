<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" fill="none" role="img" aria-label="iLovePDF + iLoveAPI → iLovePDF Tools">
  <title>iLovePDF + iLoveAPI → iLovePDF Tools</title>
  <defs>
    <clipPath id="bannerClip">
      <rect x="1" y="1" width="1198" height="218" rx="14"/>
    </clipPath>
    <radialGradient id="glowRedLeft" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#E5322D" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#E5322D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowTealCenter" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#26AEBA" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#26AEBA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRedRight" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#E53935" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#E53935" stop-opacity="0"/>
    </radialGradient>
    <filter id="iconShadow" x="-15%" y="-10%" width="130%" height="135%">
      <feOffset dx="0" dy="3" in="SourceAlpha" result="off"/>
      <feGaussianBlur stdDeviation="4" in="off" result="blur"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.09  0 0 0 0 0.09  0 0 0 0 0.11  0 0 0 0.14 0" in="blur" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Crisp white wide banner background -->
  <rect x="1" y="1" width="1198" height="218" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Subtle ambient glows behind each logo -->
  <g clip-path="url(#bannerClip)">
    <ellipse cx="299" cy="110" rx="190" ry="120" fill="url(#glowRedLeft)"/>
    <ellipse cx="643" cy="110" rx="190" ry="120" fill="url(#glowTealCenter)"/>
    <ellipse cx="944" cy="110" rx="180" ry="120" fill="url(#glowRedRight)"/>
  </g>

