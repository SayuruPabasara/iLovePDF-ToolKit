    <circle cx="0" cy="0" r="22" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    <path d="M-8.5 0H8M2.5 -6L8.5 0L2.5 6" stroke="#475569" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

